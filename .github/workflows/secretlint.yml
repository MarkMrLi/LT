{
  "rules": [
    {
      "id": "@secretlint/secretlint-rule-preset-recommend"
    },
    {
      "id": "@secretlint/secretlint-rule-pattern",
      "options": {
        "patterns": [
          {
            "name": "Zhipu AI API Key",
            "pattern": "/[a-f0-9]{32}\\.[a-zA-Z0-9]{16,}/g",
            "message": "Found a potential Zhipu AI API Key"
          },
          {
            "name": "Xunfei Starfire API Key",
            "pattern": "/[a-zA-Z0-9]{32}/g",
            "message": "Found a potential Xunfei Starfire API Key"
          },
          {
            "name": "Alibaba Tongyi Qianwen API Key",
            "pattern": "/sk-[a-zA-Z0-9]{32}/g",
            "message": "Found a potential Alibaba Tongyi Qianwen API Key"
          },
          {
            "name": "Baidu Wenxin Yiyian API Key",
            "pattern": "/[a-zA-Z0-9]{24}/g",
            "message": "Found a potential Baidu Wenxin Yiyian API Key"
          },
          {
            "name": "Huawei Pangu API Key",
            "pattern": "/[a-zA-Z0-9]{32}/g",
            "message": "Found a potential Huawei Pangu API Key"
          },
          {
            "name": "Moonshot AI Kimi API Key",
            "pattern": "/sk-[a-zA-Z0-9]{32}/g",
            "message": "Found a potential Moonshot AI Kimi API Key"
          }
        ]
      }
    }
  ]
}